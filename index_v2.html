<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=devith, initial-scale=1.0">
<title>勤怠管理アプリ</title>

<style>
body{
    font-family:sans-serif;
    background:#f4f4f4;
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
    margin-bottom:20px;
}

h1,h2{
    text-align:center;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1565c0;
}

.result{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#eef5ff;
}

.deleteBtn{
    background:#d32f2f;
    width:auto;
    padding:6px 10px;
}

.deleteBtn:hover{
    background:#b71c1c;
}

.time-row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    align-items:flex-end;
}

.time-box{
    flex:1;
}

.break-box{
    flex:0.6;
}

.time-box input{
    margin-bottom:0;
}

.date-row{
    display:flex;
    gap:20px;
    align-items:center;
    margin:10px 0;
}

.date-row label{
    display:flex;
    align-items:center;
    gap:5px;
    margin:0;
}

.date-title{
    font-weight:bold;
    margin-right:10px;
    white-space:nowrap;
}

.date-row input{
    width:auto;
    margin:0;
}

.worktype-row{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.worktype-title{
    font-weight:bold;
    white-space:nowrap;
}

.worktype-row select{
    flex:1;
    margin:0;
}

.month-row{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.month-title{
    font-weight:bold;
    white-space:nowrap;
}

.month-row input{
    flex:1;
    margin:0;
}

</style>

</head>
<body>

<h1>勤怠管理アプリ</h1>

<div class="card">

<h3 id="today"></h3>

<div class="date-row">

    <span class="date-title">勤務日</span>

    <label><input type="radio" name="dateType" value="today" checked> 今日</label>

    <label><input type="radio" name="dateType" value="tomorrow"> 翌日</label>

   <label>
<input type="radio" name="dateType" value="custom">
日付指定
<span id="selectedDate"></span>
</label> 

</div>

<input
type="date"
id="workDate"
value=""
style="display:none;"
>

<div class="worktype-row">

    <span class="worktype-title">勤務区分</span>

    <select id="workType">
        <option value="work">出勤</option>
        <option value="holiday">休日</option>
        <option value="absence">欠勤</option>
    </select>

</div>

<div class="time-row">

    <div class="time-box">
        <label>出勤時刻</label>
       <input
type="text"
id="start"
maxlength="5"
placeholder="2300"
oninput="
let v=this.value.replace(/\D/g,'');
if(v.length>=3){
this.value=v.slice(0,2)+':'+v.slice(2,4);
}else{
this.value=v;
}"> 
    </div>

    <div class="time-box">
        <label>退勤時刻</label>
        <input
type="text"
id="end"
maxlength="5"
placeholder="2300"
oninput="
let v=this.value.replace(/\D/g,'');
if(v.length>=3){
this.value=v.slice(0,2)+':'+v.slice(2,4);
}else{
this.value=v;
}">
    </div>

    <div class="time-box break-box">
        <label>休憩(分)</label>
        <input type="number" id="break" value="60">
    </div>

</div>

<button id="saveBtn" onclick="calc()">勤務を登録</button>

<button onclick="updateEndTime()">
退勤のみ更新
</button>
    
<div class="result" id="result"></div>

</div>

<div class="card">

<h2>月間集計</h2>

<div class="month-row">

    <span class="month-title">集計対象月</span>

    <input type="month" id="monthFilter">

</div>

<div id="monthly"></div>

</div>

<div class="card">

<h2>勤務履歴</h2>

<table>
<thead>
<tr>
<th>日付</th>
<th>区分</th>
<th>出勤</th>
<th>退勤</th>
<th>実働</th>
<th>残業</th>
<th>削除</th>
</tr>
</thead>

<tbody id="historyBody"></tbody>

</table>

</div>

<script>

function formatDate(date){
    return date.toISOString().split("T")[0];
}

document.getElementById("today").textContent =
"本日 : " + formatDate(new Date());

document.getElementById("workDate").value =
formatDate(new Date());

 const now = new Date();

const currentTime =
String(now.getHours()).padStart(2,"0")
+ ":"
+ String(now.getMinutes()).padStart(2,"0");

document.getElementById("start")
.placeholder = currentTime;

document.getElementById("end")
.placeholder = currentTime;
    
document.getElementById("monthFilter").value =
new Date().toISOString().slice(0,7);

document.getElementById("monthFilter")
.addEventListener("change", loadData);
    
document.getElementById("workType")
.addEventListener("change", toggleWorkInputs);

toggleWorkInputs();

document.querySelectorAll('input[name="dateType"]').forEach(radio => {

    radio.addEventListener("change", function(){

if(this.value === "today"){

    document.getElementById("selectedDate").textContent =
    "(" + formatDate(new Date()) + ")";

    document.getElementById("workDate").style.display =
    "none";

}
else if(this.value === "tomorrow"){

    let d = new Date();

    d.setDate(d.getDate() + 1);

    document.getElementById("selectedDate").textContent =
    "(" + formatDate(d) + ")";

    document.getElementById("workDate").style.display =
    "none";

}
else{

    document.getElementById("workDate").style.display =
    "block";

}

    });

});

document.getElementById("workDate")
.addEventListener("change", function(){

    document.getElementById("selectedDate").textContent =
    "(" + this.value + ")";

});

loadData();
    
function toggleWorkInputs(){

const workType =
document.getElementById("workType").value;

const start =
document.getElementById("start");

const end =
document.getElementById("end");

const breakInput =
document.getElementById("break");

const disabled =
(workType === "holiday" ||
 workType === "absence");

start.disabled = disabled;
end.disabled = disabled;
breakInput.disabled = disabled;

}

function updateEndTime(){

const end =
document.getElementById("end").value;

if(!end){
    alert("退勤時刻を入力してください");
    return;
}

let records =
JSON.parse(localStorage.getItem("records")) || [];

let target =
records.find(r =>
    r.type === "work" &&
    r.start &&
    (!r.end || r.end === "-")
);

if(!target){
    alert("未退勤の勤務が見つかりません");
    return;
}

target.end = end;

let startMin =
parseInt(target.start.split(":")[0]) * 60 +
parseInt(target.start.split(":")[1]);

let endMin =
parseInt(end.split(":")[0]) * 60 +
parseInt(end.split(":")[1]);

if(endMin < startMin){
    endMin += 1440;
}

let work =
endMin - startMin - (target.breakTime || 0);

if(work < 0){
    work = 0;
}

target.work = work;
target.overtime = Math.max(0, work - 480);

let h = Math.floor(work/60);
let m = work%60;

let oh = Math.floor(target.overtime/60);
let om = target.overtime%60;

document.getElementById("result").innerHTML =
`
実働時間<br>
${h}時間 ${m}分
<br><br>
残業時間<br>
${oh}時間 ${om}分
`;

localStorage.setItem(
    "records",
    JSON.stringify(records)
);

loadData();

alert("退勤時刻を更新しました");

}

function calc(){

    const btn=document.getElementById("saveBtn");
    btn.disabled=true;

    const workType=
    document.getElementById("workType").value;

    const dateType=
    document.querySelector(
    'input[name="dateType"]:checked'
    ).value;

    let workDate;

    if(dateType==="today"){
        workDate=formatDate(new Date());
    }
    else if(dateType==="tomorrow"){
        let d=new Date();
        d.setDate(d.getDate()+1);
        workDate=formatDate(d);
    }
    else{

    workDate =
    document.getElementById("selectedDate")
    .textContent
    .replace("(","")
    .replace(")","");

}

    if(!workDate){
        alert("日付を選択してください");
        btn.disabled=false;
        return;
    }

    const start=
    document.getElementById("start").value;

    const end=
    document.getElementById("end").value;

    const breakTime=
    parseInt(document.getElementById("break").value)||0;

    let work=0;
    let overtime=0;

    if(workType==="work"){
        
    if(!start && !end){
    alert("出勤時刻または退勤時刻を入力してください");
    btn.disabled=false;
    return;
}

        const exists=
        (JSON.parse(localStorage.getItem("records")) || [])
        .some(r =>
            r.date===workDate &&
            r.start===start &&
            r.end===end
        );

        if(exists){
            alert("同じ勤務が登録されています");
            btn.disabled=false;
            return;
        }

        let startMin=
        parseInt(start.split(":")[0])*60+
        parseInt(start.split(":")[1]);

        let endMin=
        parseInt(end.split(":")[0])*60+
        parseInt(end.split(":")[1]);

        if(endMin<startMin){
            endMin+=1440;
        }

        work=endMin-startMin-breakTime;

        if(work<0){
            work=0;
        }

        overtime=Math.max(0,work-480);
    }
if(!work){
work = 0;
}

if(!overtime){
overtime = 0;
}
    let h=Math.floor(work/60);
    let m=work%60;

    let oh=Math.floor(overtime/60);
    let om=overtime%60;

    document.getElementById("result").innerHTML=
    `
    実働時間<br>
    ${h}時間 ${m}分
    <br><br>
    残業時間<br>
    ${oh}時間 ${om}分
    `;

    saveRecord(
        work,
        overtime,
        start,
        end,
        breakTime,
        workDate,
        workType
    );

    setTimeout(()=>{
        btn.disabled=false;
    },1000);
}

function saveRecord(
work,
overtime,
start,
end,
breakTime,
workDate,
workType
){

    let records=
    JSON.parse(localStorage.getItem("records")) || [];
    
    records.unshift({
        id:Date.now(),
        date:workDate,
        type:workType,
        start:start,
        end:end,
        breakTime:breakTime,
        work:work,
        overtime:overtime
    });

    localStorage.setItem(
        "records",
        JSON.stringify(records)
    );

    loadData();

    document.getElementById("start").value="";
    document.getElementById("end").value="";

    }

    function deleteRecord(id){

let records =
JSON.parse(localStorage.getItem("records")) || [];

records = records.filter(
r => r.id !== id
);

localStorage.setItem(
"records",
JSON.stringify(records)
);

loadData();

}
        
function loadData(){

let records =
JSON.parse(localStorage.getItem("records")) || [];

let totalWork = 0;
let totalOver = 0;

let workCount = 0;
let holidayCount = 0;
let absenceCount = 0;

let html = "";

const monthFilter =
document.getElementById("monthFilter").value;

records.forEach(r=>{

if(r.type==="work"){
workCount++;
totalWork += r.work || 0;
totalOver += r.overtime || 0;
}
else if(r.type==="holiday"){
holidayCount++;
}
else if(r.type==="absence"){
absenceCount++;
}

html += `
<tr>
<td>${r.date}</td>
<td>${
r.type==="work" ? "出勤" :
r.type==="holiday" ? "休日" :
"欠勤"
}</td>
<td>${r.start || "-"}</td>
<td>${r.end || "-"}</td>
<td>${Math.floor((r.work||0)/60)}h${(r.work||0)%60}m</td>
<td>${Math.floor((r.overtime||0)/60)}h${(r.overtime||0)%60}m</td>
<td>
<button class="deleteBtn"
onclick="deleteRecord(${r.id})">
削除
</button>
</td>
</tr>
`;

});

let workH = Math.floor(totalWork/60);
let workM = totalWork%60;

let overH = Math.floor(totalOver/60);
let overM = totalOver%60;

document.getElementById("monthly").innerHTML = `

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:8px 40px;
font-weight:bold;
align-items:center;
">

    <div>
        集計対象月
        ${monthFilter.replace("-", "年")}月
    </div>

    <div>
        勤務回数 ${workCount}回
    </div>

    <div>
        勤務時間 ${workH}時間${workM}分
    </div>

    <div>
        休日 ${holidayCount}日
    </div>

    <div>
        残業時間 ${overH}時間${overM}分
    </div>

    <div>
        欠勤 ${absenceCount}日
    </div>

</div>

`;

document.getElementById("historyBody").innerHTML =
html;

}   

</script>
</body>
</html>
